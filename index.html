<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="초등 5학년 영어 8단원 What does he look like? 미니북 기반 웹 활동">
<title>What Does He Look Like?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&family=Fredoka:wght@500;600;700&display=swap">
<style>
/* Layout: graph-paper notebook with index tabs; each tab is one activity from the mini-book (1–4) plus a dress-up builder. Red = has, green = is wearing (the book's own color code). */
:root {
  --bg: #eef3fa;
  --grid: #dbe5f3;
  --card: #ffffff;
  --ink: #1d2742;
  --muted: #5d6a86;
  --line: #cfd9ea;
  --accent: #2856d6;
  --accent-soft: #e3eafc;
  --has: #d23a2c;
  --has-soft: #fde6e3;
  --wear: #128a54;
  --wear-soft: #ddf4e8;
  --sticker: #fffdf6;
  --sticker-line: #e6dfcc;
  --wood: #d9b07c;
  --wood-edge: #b88a55;
  --bad: #c2410c;
  --f-display: "Jua", "Gowun Dodum", system-ui, sans-serif;
  --f-body: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-en: "Fredoka", "Jua", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131a28; --grid: #1b2436; --card: #1c2537; --ink: #e8eefa; --muted: #9aa8c4; --line: #2e3a53;
    --accent: #8aa9ff; --accent-soft: #24345a; --has: #ff7a6b; --has-soft: #45231f; --wear: #47d394; --wear-soft: #183a2c;
    --sticker: #fffdf6; --sticker-line: #3a4560; --wood: #c99e6b; --wood-edge: #8f6a40; --bad: #fb923c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131a28; --grid: #1b2436; --card: #1c2537; --ink: #e8eefa; --muted: #9aa8c4; --line: #2e3a53;
  --accent: #8aa9ff; --accent-soft: #24345a; --has: #ff7a6b; --has-soft: #45231f; --wear: #47d394; --wear-soft: #183a2c;
  --sticker: #fffdf6; --sticker-line: #3a4560; --wood: #c99e6b; --wood-edge: #8f6a40; --bad: #fb923c;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background-color: var(--bg);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 16px;
  line-height: 1.55;
}
.wrap { max-width: 980px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 48px; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.en { font-family: var(--f-en); font-weight: 600; }
.h { color: var(--has); }
.w { color: var(--wear); }

/* header */
header.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; margin-bottom: 18px; }
.lesson { font-family: var(--f-display); color: var(--accent); font-size: 15px; letter-spacing: .06em; }
h1 { font-family: var(--f-en); font-weight: 700; font-size: clamp(28px, 5vw, 44px); line-height: 1.1; margin: 2px 0 6px; text-wrap: balance; }
.formula { display: flex; flex-wrap: wrap; gap: 6px 18px; font-family: var(--f-en); font-weight: 600; font-size: 17px; }
.formula span small { font-family: var(--f-body); font-weight: 400; color: var(--muted); font-size: 14px; }
.name { display: flex; align-items: center; gap: 8px; font-family: var(--f-display); font-size: 18px; }
.name input { font: inherit; font-family: var(--f-body); width: 9em; border: 0; border-bottom: 2px solid var(--ink); background: transparent; color: var(--ink); padding: 2px 4px; }

/* tabs */
nav.tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 0; scrollbar-width: none; }
nav.tabs::-webkit-scrollbar { display: none; }
.tab { flex: 0 0 auto; border: 2px solid var(--line); border-bottom: 0; background: var(--bg); border-radius: 12px 12px 0 0; padding: 8px 14px 6px; font-family: var(--f-display); font-size: 16px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.tab b { font-weight: 400; display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--line); color: var(--ink); font-size: 13px; }
.tab[aria-selected="true"] { background: var(--card); color: var(--ink); border-color: var(--line); position: relative; top: 2px; }
.tab[aria-selected="true"] b { background: var(--accent); color: var(--card); }
.tab .star { color: #e0a100; font-size: 14px; }
.sheet { background: var(--card); border: 2px solid var(--line); border-radius: 0 16px 16px 16px; padding: clamp(16px, 3vw, 28px); min-height: 420px; }
.task { font-family: var(--f-display); font-size: 20px; margin: 0 0 4px; }
.sub { color: var(--muted); margin: 0 0 18px; font-size: 15px; }

/* shared bits */
.sticker { background: var(--sticker); border: 2px solid var(--sticker-line); border-radius: 14px; display: grid; place-items: center; }
.sticker svg { width: 100%; height: 100%; display: block; }
.say { border: 0; background: var(--accent-soft); color: var(--accent); width: 34px; height: 34px; border-radius: 50%; display: inline-grid; place-items: center; flex: 0 0 auto; }
.say svg { width: 18px; height: 18px; }
.say:hover { filter: brightness(.95); }
.pron { color: var(--muted); font-size: 14px; }
.btn { border: 2px solid var(--ink); background: var(--card); border-radius: 999px; padding: 6px 16px; font-family: var(--f-display); font-size: 16px; }
.btn.primary { background: var(--ink); color: var(--card); }
.btn:disabled { opacity: .4; cursor: default; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.msg { min-height: 1.6em; font-family: var(--f-display); font-size: 17px; }
.msg.bad { color: var(--bad); }
.msg.good { color: var(--wear); }
@keyframes shake { 0%,100% { transform: translateX(0) } 25% { transform: translateX(-6px) } 75% { transform: translateX(6px) } }
.shake { animation: shake .3s ease 2; }
@keyframes pop { 0% { transform: scale(.6) } 70% { transform: scale(1.15) } 100% { transform: scale(1) } }
@media (prefers-reduced-motion: reduce) { .shake, .pop { animation: none !important; } }

/* 1. word builder */
.dots { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
.dot { width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--line); background: var(--card); font-family: var(--f-display); font-size: 15px; color: var(--muted); }
.dot.done { background: var(--wear); border-color: var(--wear); color: var(--card); }
.dot.cur { border-color: var(--accent); color: var(--accent); }
.dot.done.cur { color: var(--card); box-shadow: 0 0 0 3px var(--accent-soft); }
.wb { display: grid; grid-template-columns: minmax(0, 220px) minmax(0, 1fr); gap: 24px; align-items: center; }
.wb .sticker { aspect-ratio: 1; max-width: 100%; padding: 12px; }
.eq { font-family: var(--f-en); font-weight: 600; font-size: clamp(24px, 4.4vw, 36px); display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 10px; margin-bottom: 6px; }
.blank { display: inline-block; min-width: 4.2em; text-align: center; border-bottom: 3px dashed var(--accent); color: var(--accent); padding: 0 6px; }
.blank.filled { border-bottom-style: solid; border-color: var(--wear); color: var(--wear); }
.result { display: flex; align-items: center; gap: 10px; min-height: 40px; margin-bottom: 8px; }
.palette { position: relative; background: var(--wood); border: 3px solid var(--wood-edge); border-radius: 46% 54% 52% 48% / 58% 50% 50% 42%; padding: 20px 26px 22px; display: flex; flex-wrap: wrap; gap: 12px 14px; justify-content: center; max-width: 440px; }
.paint { border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 2px; width: 62px; }
.paint i { width: 40px; height: 40px; border-radius: 50%; border: 2px solid rgba(0,0,0,.25); box-shadow: inset -4px -5px 0 rgba(0,0,0,.14); }
.paint span { font-family: var(--f-en); font-weight: 600; font-size: 14px; color: #3d2a12; }
.paint:hover i { transform: scale(1.08); }
.words { display: flex; flex-wrap: wrap; gap: 12px; }
.word { border: 2px solid var(--ink); background: var(--card); border-radius: 14px; padding: 8px 16px; display: flex; align-items: center; gap: 10px; font-family: var(--f-en); font-weight: 600; font-size: 22px; }
.word svg { width: 48px; height: 28px; }

/* 2/3. matching */
.match { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 16px 28px; }
.col { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.sent { display: flex; align-items: center; gap: 10px; border: 2px solid var(--line); border-radius: 14px; padding: 8px 10px 8px 12px; background: var(--card); text-align: left; width: 100%; min-height: 66px; }
.sent .txt { flex: 1; min-width: 0; }
.sent .txt .en { font-size: 18px; display: block; line-height: 1.25; }
.sent.sel { border-color: var(--accent); background: var(--accent-soft); }
.sent.ok { border-color: var(--line); opacity: .92; }
.badge { flex: 0 0 auto; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-display); font-size: 15px; background: var(--line); color: var(--muted); }
.ok .badge { color: #fff; }
.has-set .ok .badge { background: var(--has); }
.wear-set .ok .badge { background: var(--wear); }
.pics { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.pic { position: relative; padding: 6px; aspect-ratio: 1; border: 2px solid var(--sticker-line); border-radius: 14px; background: var(--sticker); }
.pic:hover { border-color: var(--accent); }
.pic.ok { border-color: var(--line); }
.pic .badge { position: absolute; top: 6px; left: 6px; }
.pic.armed { border-style: dashed; border-color: var(--accent); }
.pic svg { width: 100%; height: 100%; display: block; }
.done-banner { margin-top: 18px; padding: 14px 16px; border-radius: 14px; background: var(--wear-soft); color: var(--wear); font-family: var(--f-display); font-size: 18px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; }

/* 4. bingo board */
.seg { display: inline-flex; border: 2px solid var(--ink); border-radius: 999px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 6px 14px; font-family: var(--f-display); font-size: 15px; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--card); }
.board { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 3px solid var(--ink); border-radius: 6px; overflow: hidden; max-width: 560px; margin: 16px 0; }
.cell { position: relative; border: 0; border-right: 2px solid var(--ink); border-bottom: 2px solid var(--ink); background: var(--card); aspect-ratio: 1 / .95; padding: 8px 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-family: var(--f-en); font-weight: 700; font-size: clamp(14px, 2.8vw, 20px); line-height: 1.1; text-align: center; }
.cell:nth-child(3n) { border-right: 0; }
.cell:nth-child(n+7) { border-bottom: 0; }
.cell .ico { width: 52%; max-width: 70px; aspect-ratio: 1; background: var(--sticker); border-radius: 10px; padding: 2px; }
.cell .ico svg { width: 100%; height: 100%; display: block; }
.cell.sel { background: var(--accent-soft); }
.cell.has { background: var(--has-soft); color: var(--has); }
.cell.wear { background: var(--wear-soft); color: var(--wear); }
.board-wrap { position: relative; max-width: 560px; margin: 16px 0; }
.board-wrap .board { margin: 0; }
.trail { position: absolute; inset: 3px; width: calc(100% - 6px); height: calc(100% - 6px); pointer-events: none; z-index: 2; }
.trail path { fill: none; stroke: var(--accent); stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; opacity: .6; vector-effect: non-scaling-stroke; }
.cell.found { background: var(--accent-soft); }
.cell.found > :not(.node) { opacity: .45; }
.node { position: absolute; left: calc(50% - 18px); top: calc(50% - 18px); z-index: 3; width: 36px; height: 36px; border-radius: 50%; background: var(--accent); color: var(--card); display: grid; place-items: center; font-family: var(--f-display); font-size: 18px; box-shadow: 0 0 0 5px var(--accent-soft); }
.node.new { animation: pop .3s ease; }
.pin { display: flex; gap: 10px; align-items: center; }
.pin i { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--ink); }
.pin i.on { background: var(--accent); border-color: var(--accent); }
.pin i.now { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.unlock { display: flex; flex-direction: column; gap: 8px; padding: 14px 16px; border-radius: 14px; background: var(--wear-soft); }
.unlock h3 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 22px; color: var(--wear); display: flex; align-items: center; gap: 8px; }
.unlock h3 svg { width: 26px; height: 26px; }
.unlock ol { margin: 0; padding-left: 1.4em; display: flex; flex-direction: column; gap: 6px; }
.unlock li .line { gap: 8px; }
.stamp { position: absolute; inset: 10%; border: 4px solid var(--has); border-radius: 50%; color: var(--has); display: grid; place-items: center; font-family: var(--f-display); font-size: clamp(14px, 3vw, 22px); transform: rotate(-14deg); background: color-mix(in srgb, var(--card) 35%, transparent); animation: pop .3s ease; }
.panel { border: 2px dashed var(--line); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; max-width: 560px; }
.choice { border: 2px solid currentColor; background: var(--card); border-radius: 999px; padding: 6px 16px; font-family: var(--f-en); font-weight: 700; font-size: 18px; }
.choice.h { color: var(--has); }
.choice.w { color: var(--wear); }
.bigsent { font-family: var(--f-en); font-weight: 600; font-size: clamp(20px, 3.6vw, 26px); line-height: 1.25; }
.lines { font-family: var(--f-display); font-size: 20px; color: var(--has); }
.b4 { display: grid; grid-template-columns: minmax(0, 560px) minmax(0, 1fr); gap: 0 28px; align-items: start; }
.legend { display: flex; flex-direction: column; gap: 8px; margin-top: 16px; font-size: 15px; }
.legend > div:not(.pron) { display: flex; gap: 8px; align-items: baseline; }

/* 5. builder */
.builder { display: grid; grid-template-columns: minmax(0, 300px) minmax(0, 1fr); gap: 24px; align-items: start; }
.stage { padding: 10px; aspect-ratio: 2 / 3; max-width: 100%; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); }
.opts { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.opt { display: grid; grid-template-columns: 6.2em minmax(0, 1fr); gap: 8px; align-items: center; }
.opt > span { font-family: var(--f-display); font-size: 15px; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 2px solid var(--line); background: var(--card); border-radius: 999px; padding: 3px 12px; font-family: var(--f-en); font-weight: 600; font-size: 15px; display: inline-flex; align-items: center; gap: 6px; }
.chip i { width: 14px; height: 14px; border-radius: 50%; border: 1px solid rgba(0,0,0,.3); }
.chip[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: var(--card); }
.mission { position: relative; overflow: hidden; border-radius: 16px; background: var(--wear-soft); padding: clamp(18px, 3vw, 28px); display: grid; grid-template-columns: minmax(0, 260px) minmax(0, 1fr); gap: 24px; align-items: start; }
.mission .stage { position: static; background: var(--sticker); }
.mission-head { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; position: relative; z-index: 1; }
.mission-head h2 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: clamp(32px, 6vw, 48px); color: var(--wear); line-height: 1.1; }
.mission-head p { margin: 0; font-family: var(--f-display); font-size: 18px; }
.mission .qa { margin-top: 0; border-top: 0; padding-top: 0; position: relative; z-index: 1; }
.mission .stage { position: relative; z-index: 1; }
.line .grow { flex: 1; min-width: 0; }
.tog { flex: 0 0 auto; border: 2px solid var(--line); background: var(--card); border-radius: 999px; padding: 2px 12px; font-family: var(--f-display); font-size: 14px; color: var(--muted); }
.tog.on { border-color: var(--accent); background: var(--accent); color: var(--card); }
.line.hid { min-height: 44px; }
.mask { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 2px 10px; border: 2px dashed var(--accent); background: repeating-linear-gradient(45deg, var(--card) 0 10px, var(--accent-soft) 10px 20px); border-radius: 12px; padding: 6px 12px; }
.mask .ko { font-size: 17px; font-weight: 700; }
.mask small { color: var(--accent); font-size: 13px; }
.cover { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; border: 2px dashed var(--accent); background: var(--card); border-radius: 12px; padding: 8px 12px; min-height: 52px; }
.cover .en { font-size: 18px; }
.cover .bar { flex: 1; height: 14px; border-radius: 7px; background: repeating-linear-gradient(45deg, var(--accent-soft) 0 8px, var(--line) 8px 16px); }
.cover small { color: var(--accent); font-size: 13px; white-space: nowrap; }
.hidecount { font-family: var(--f-display); color: var(--accent); font-size: 16px; }
.trophy { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.trophy span { border: 2px solid var(--line); background: var(--card); border-radius: 999px; padding: 2px 10px; font-size: 14px; color: var(--muted); }
.trophy span.on { border-color: var(--wear); color: var(--wear); }
.confetti { position: absolute; top: -20px; width: 10px; height: 16px; border-radius: 2px; animation: fall 2.6s ease-in forwards; pointer-events: none; }
@keyframes fall { from { transform: translateY(0) rotate(0); opacity: 1 } to { transform: translateY(560px) rotate(540deg); opacity: 0 } }
@media (prefers-reduced-motion: reduce) { .confetti { display: none; } }
@media (max-width: 640px) { .mission { grid-template-columns: minmax(0, 1fr); } .mission .stage { width: 200px; justify-self: center; } }
.qa { margin-top: 18px; border-top: 2px dashed var(--line); padding-top: 14px; display: flex; flex-direction: column; gap: 8px; }
.qa .q { font-family: var(--f-en); font-weight: 700; font-size: 22px; }
.line { display: flex; align-items: center; gap: 10px; }
.line .en { font-size: 18px; display: block; line-height: 1.25; }

@media (max-width: 640px) {
  .wb { grid-template-columns: minmax(0, 1fr); }
  .wb .sticker { width: 180px; justify-self: center; }
  .sheet { padding: 14px 12px; }
  .match { grid-template-columns: minmax(0, 1fr) 72px; gap: 8px; }
  .sent { position: relative; padding: 8px; min-height: 72px; gap: 6px; }
  .sent > .badge { position: absolute; top: -8px; left: -6px; width: 22px; height: 22px; font-size: 12px; }
  .sent:not(.ok) > .badge { display: none; }
  .pron { font-size: 13px; }
  .pic { height: 72px; }
  .pics { grid-template-columns: minmax(0, 1fr); }
  .pic { aspect-ratio: auto; }
  .pic svg { width: 54px; margin: 0 auto; }
  .sent .txt .en { font-size: 16px; }
  .say { width: 30px; height: 30px; }
  .b4 { grid-template-columns: minmax(0, 1fr); }
  .builder { grid-template-columns: minmax(0, 1fr); }
  .stage { position: static; width: 200px; justify-self: center; }
  .opt { grid-template-columns: minmax(0, 1fr); gap: 4px; }
}
</style>

<body>
<div class="wrap">
  <header class="top">
    <div>
      <div class="lesson">5학년 · LESSON 8</div>
      <h1>What does he look like?</h1>
      <div class="formula">
        <span>He / She <span class="h">has</span> + 특징 <small>~을 가지고 있다</small></span>
        <span>He / She <span class="w">is wearing</span> + 옷·장신구 <small>~을 입고 있다</small></span>
      </div>
    </div>
    <label class="name" for="nm">이름 : <input id="nm" autocomplete="off" placeholder="이름 쓰기"></label>
  </header>

  <nav class="tabs" role="tablist" id="tabs"></nav>
  <main class="sheet" id="sheet"></main>
</div>

<script>
(() => {
  // ---------- storage (per-viewer conveniences only) ----------
  const store = {
    get(k, d) { try { const v = localStorage.getItem('lk8-' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem('lk8-' + k, JSON.stringify(v)); } catch (e) {} }
  };
  const nm = document.getElementById('nm');
  nm.value = store.get('name', '');
  nm.addEventListener('input', () => store.set('name', nm.value));

  // ---------- speech ----------
  let voice = null;
  function pickVoice() {
    try {
      const vs = speechSynthesis.getVoices();
      voice = vs.find(v => /en[-_]US/i.test(v.lang) && /Google|Samantha|Aria|Jenny|Zira/i.test(v.name)) || vs.find(v => /en[-_]US/i.test(v.lang)) || vs.find(v => /^en/i.test(v.lang)) || null;
    } catch (e) {}
  }
  if ('speechSynthesis' in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }

      ? `<p class="task">2. 문장을 읽고 알맞은 신체적 특징과 연결해 봅시다.</p><p class="sub">He / She <b class="h en">has</b> + 특징 &nbsp;[해즈] · 문장을 누른 다음 알맞은 그림을 눌러요.</p>`
      : `<p class="task">3. 문장을 읽고 알맞은 옷이나 신발을 연결해 봅시다.</p><p class="sub">He / She <b class="w en">is wearing</b> + 옷·장신구 &nbsp;[이즈 웨어링] · 문장을 누른 다음 알맞은 그림을 눌러요.</p>`;
    const sents = items.map((it, i) => {
      const ok = st.ok[i] != null;
      return `<div class="sent ${st.sel === i ? 'sel' : ''} ${ok ? 'ok' : ''}" role="button" tabindex="0" data-ms="${i}" aria-pressed="${st.sel === i}">
        <span class="badge">${ok ? st.ok[i] : i + 1}</span>
        <span class="txt"><span class="en">${colorize(it.s)}</span><span class="pron">${pron(it.s)}</span></span>
        ${sayBtn(it.s)}</div>`;
    }).join('');
    const pics = st.order.map(i => {
      const ok = st.ok[i] != null;
      return `<button class="pic ${ok ? 'ok' : ''} ${st.sel != null && !ok ? 'armed' : ''} ${st.bad === i ? 'shake' : ''}" data-mp="${i}" aria-label="그림 ${i + 1}" ${ok ? 'disabled' : ''}>${ok ? `<span class="badge">${st.ok[i]}</span>` : ''}${items[i].pic()}</button>`;
    }).join('');
    return `${title}
      <div class="match ${key}-set"><div class="col">${sents}</div><div class="col"><div class="pics">${pics}</div></div></div>
      <div class="msg ${st.msg.startsWith('다시') ? 'bad' : 'good'}" style="margin-top:12px">${st.msg}</div>
      ${all ? `<div class="done-banner">모두 연결했어요! ${items.length}개 중 ${items.length}개 정답 <span class="row"><button class="btn" data-mreset="${key}">다시 하기</button><button class="btn primary" data-tab-go="${key === 'has' ? 'wear' : 'bingo'}">다음 활동 →</button></span></div>` : ''}`;
  }

  // ---------- 4. board / bingo ----------
  function viewBingo() {
    const b = S.bingo, sort = b.mode === 'sort';
    const L = b.lock, pos = {}; L.seq.slice(0, L.step).forEach((q, k) => pos[q.i] = k + 1);
    const cells = BOARD.map((c, i) => {
      const cls = sort ? (b.sorted[i] ? c.v : (b.sel === i ? 'sel' : '')) : (pos[i] ? 'found' : '');
      return `<button class="cell ${cls} ${b.bad === i ? 'shake' : ''}" data-cell="${i}"><span class="ico">${c.pic()}</span><span>${c.p}</span>${!sort && pos[i] ? `<span class="node ${pos[i] === L.step ? 'new' : ''}">${pos[i]}</span>` : ''}</button>`;
    }).join('');
    let panel, trail = '';
    if (sort) {
      if (b.sel == null) panel = `<div class="pron">어휘 칸을 하나 눌러 보세요.</div>`;
      else if (b.sorted[b.sel]) { const t = fullSent(b.sel, b.pron); panel = `<div class="line"><span class="bigsent">${colorize(t)}</span>${sayBtn(t)}</div><div class="pron">${pron(t)}</div>`; }
      else panel = `<div><b class="h en">'has'</b> 와 <b class="w en">'is wearing'</b> 중 알맞은 것은?</div>
        <div class="row"><span class="en" style="font-size:18px">${b.pron}</span><button class="choice h" data-sort="has">has</button><button class="choice w" data-sort="wear">is wearing</button><span class="en" style="font-size:18px">${BOARD[b.sel].p}.</span></div>`;
      panel += `<div class="msg ${b.msg.startsWith('다시') ? 'bad' : 'good'}">${b.msg}</div>`;
    } else {
      const pts = L.seq.slice(0, L.step).map(q => `${50 + (q.i % 3) * 100} ${50 + Math.floor(q.i / 3) * 100}`);
      if (pts.length > 1) trail = `<svg class="trail" viewBox="0 0 300 300" preserveAspectRatio="none" aria-hidden="true"><path d="M${pts.join(' L')}"/></svg>`;
      const dots = L.seq.map((_, k) => `<i class="${k < L.step ? 'on' : (k === L.step && L.started ? 'now' : '')}"></i>`).join('');
      const cur = L.seq[L.step];
      if (L.step === 6) {
        panel = `<div class="unlock"><h3><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 7.5-2"/></svg>잠금 해제!</h3>
          <div>6개 문장을 순서대로 모두 찾았어요. 틀린 횟수 <b>${L.miss}번</b></div>
          <ol>${L.seq.map(q => `<li><span class="line"><span class="en">${colorize(q.t)}</span>${sayBtn(q.t)}</span></li>`).join('')}</ol>
          <div class="row"><button class="btn primary" data-lockreset>새 패턴으로 다시</button></div></div>`;
      } else {
        panel = `<div class="row" style="justify-content:space-between"><div class="pin" aria-label="${L.step}/6 찾음">${dots}</div><span class="pron">${L.step} / 6</span></div>
          <div class="row">${L.started ? `<button class="btn primary" data-listen>▶ ${L.step + 1}번째 문장 다시 듣기</button>` : '<button class="btn primary" data-listen>▶ 시작하기</button>'}
          <button class="btn" data-showtext aria-pressed="${b.showText}">${b.showText ? '글자 숨기기' : '글자 보기'}</button></div>
          ${L.started && b.showText ? `<div class="bigsent">${colorize(cur.t)}</div>` : ''}
          <div class="msg ${b.msg.startsWith('다시') ? 'bad' : 'good'}">${b.msg || (L.started ? '들은 문장에 맞는 칸을 눌러요.' : '문장 6개를 차례로 들려줘요. 순서대로 칸을 이으면 잠금이 풀려요.')}</div>`;
      }
    }
    return `<p class="task">4. 아래 어휘를 알맞은 자리에 넣어 읽어 봅시다.</p>
      <div class="row" style="margin:8px 0 2px">
        <div class="seg" role="group" aria-label="활동 방식"><button data-mode="sort" aria-pressed="${sort}">분류하고 읽기</button><button data-mode="listen" aria-pressed="${!sort}">듣고 패턴 잠금 풀기</button></div>
        ${sort ? `<div class="seg" role="group" aria-label="주어"><button data-pron="He" aria-pressed="${b.pron === 'He'}">He</button><button data-pron="She" aria-pressed="${b.pron === 'She'}">She</button></div>` : ''}
      </div>
      <div class="b4">
        <div><div class="board-wrap"><div class="board">${cells}</div>${trail}</div><div class="panel">${panel}</div></div>
        <div class="legend">
          <div><b class="h en">has</b><span>머리 모양, 눈처럼 몸의 특징</span></div>
          <div><b class="w en">is wearing</b><span>옷, 신발, 모자, 안경</span></div>
          <div class="pron">a pink cap, a blue jacket, a yellow T-shirt처럼 하나인 물건 앞에는 <b class="en">a</b>를 붙여요. pants, shoes, glasses는 짝으로 된 물건이라 <b class="en">a</b>를 붙이지 않아요.</div>
        </div>
      </div>`;
  }

  // ---------- 5. builder ----------
  const KC = { red:'빨간', orange:'주황색', yellow:'노란', green:'초록색', blue:'파란', purple:'보라색', pink:'분홍색', brown:'갈색', black:'검은', white:'하얀' };
  const KH = { brown:'갈색', black:'검은', yellow:'노란', red:'빨간' };
  const KE = { brown:'갈색', blue:'파란', green:'초록색', black:'검은' };
  function meMeanings() {
    const m = S.me, w = m.who === 'He' ? '그는' : '그녀는', out = [];
    const hair = m.hair === 'short' ? `짧은 ${KH[m.hairColor]} 머리` : m.hair === 'curly' ? `${KH[m.hairColor]} 곱슬머리` : `${KH[m.hairColor]} 생머리`;
    out.push(`${w} ${hair}를 가지고 있어요.`);
    out.push(`${w} ${m.bigEyes ? '큰 ' : ''}${KE[m.eyeColor]} 눈을 가지고 있어요.`);
    out.push(`${w} ${KC[m.topColor]} ${m.top === 'jacket' ? '재킷' : '티셔츠'}를 입고 있어요.`);
    out.push(`${w} ${KC[m.bottomColor]} ${m.bottom === 'shorts' ? '반바지' : '바지'}를 입고 있어요.`);
    out.push(`${w} ${KC[m.shoesColor]} 신발을 신고 있어요.`);
    if (m.cap) out.push(`${w} ${KC[m.cap]} 모자를 쓰고 있어요.`);
    if (m.glasses) out.push(`${w} ${KC[m.glasses]} 안경을 쓰고 있어요.`);
    return out;
  }
  function meSentences() {
    const m = S.me, w = m.who, out = [];
    out.push(`${w} has ${m.hair} ${m.hairColor} hair.`);
    out.push(`${w} has ${m.bigEyes ? 'big ' : ''}${m.eyeColor} eyes.`);
    out.push(`${w} is wearing ${m.top === 'jacket' ? 'a ' + m.topColor + ' jacket' : 'a ' + m.topColor + ' T-shirt'}.`);
    out.push(`${w} is wearing ${m.bottomColor} ${m.bottom}.`);
    out.push(`${w} is wearing ${m.shoesColor} shoes.`);
    if (m.cap) out.push(`${w} is wearing a ${m.cap} cap.`);
    if (m.glasses) out.push(`${w} is wearing ${m.glasses} glasses.`);
    return out;
  }
  function chips(field, vals, opts = {}) {
    return `<div class="chips">${vals.map(v => {
      const label = v === '' ? (opts.none || 'none') : v;
      const sw = opts.swatch && v ? `<i style="background:${(opts.swatch === 'hair' ? HAIR : C)[v]}"></i>` : '';
      const val = typeof v === 'boolean' ? String(v) : v;
      return `<button class="chip" data-me="${field}" data-v="${val}" aria-pressed="${String(S.me[field]) === val}">${sw}${opts.labels ? opts.labels[val] : label}</button>`;
    }).join('')}</div>`;
  }
  function viewMe() {
    const m = S.me, sents = meSentences();
    const q = `What does ${m.who === 'He' ? 'he' : 'she'} look like?`;
    if (S.meDone) {
      const nmv = (nm.value || '').trim();
      const conf = !S.confetti ? '' : Array.from({ length: 28 }, (_, k) => `<i class="confetti" style="left:${Math.random() * 100}%;background:${Object.values(C)[k % 9]};animation-delay:${(Math.random() * .8).toFixed(2)}s"></i>`).join('');
      S.confetti = false;
      const acts = [['wb', '1 단어 완성'], ['has', '2 has 연결'], ['wear', '3 is wearing 연결'], ['bingo', '4 어휘판']];
      return `<div class="mission">${conf}
        <div class="mission-head"><h2>미션 성공!</h2><p>${nmv ? nmv.replace(/[<>&"]/g, '') + ' 학생, ' : ''}내 캐릭터를 영어로 설명했어요.</p></div>
        <div class="sticker stage">${character(m)}</div>
        <div class="qa">
          <div class="line"><span class="q">${q}</span>${sayBtn(q)}</div>
          ${(() => { const ko = meMeanings(); return sents.map((t, k) => {
            if (S.hidden.includes(k)) return `<div class="line hid"><span class="mask"><span class="ko">${ko[k]}</span><small>영어로 말해 보세요</small></span><button class="tog on" data-tog="${k}">보이기</button></div>`;
            return `<div class="line">${sayBtn(t)}<span class="grow"><span class="en">${colorize(t)}</span><span class="pron">${pron(t)}</span></span><button class="tog" data-tog="${k}">가리기</button></div>`;
          }).join(''); })()}
          <div class="row" style="margin-top:6px"><button class="btn primary" data-hide>문장 랜덤 가리기</button>${S.hidden.length ? '<button class="btn" data-unhide>모두 보이기</button>' : '<button class="btn" data-readall>▶ 모두 읽기</button>'}<button class="btn" data-meredo>다시 만들기</button></div>
          <div class="trophy">${acts.map(([id, l]) => `<span class="${isDone(id) ? 'on' : ''}">${isDone(id) ? '★ ' : ''}${l}</span>`).join('')}</div>
        </div>
      </div>`;
    }
    const CL = ['red', 'orange', 'yellow', 'green', 'blue', 'purple', 'pink', 'brown', 'black', 'white'];
    return `<p class="task">캐릭터를 꾸미고 문장으로 말해 봅시다.</p>
      <p class="sub">고를 때마다 그림과 영어 문장이 함께 바뀌어요.</p>
      <div class="builder">
        <div class="sticker stage">${character(m)}</div>
        <div>
          <div class="opts">
            <div class="opt"><span>누구?</span>${chips('who', ['He', 'She'])}</div>
            <div class="opt"><span class="h">머리 모양</span>${chips('hair', ['short', 'straight', 'curly'])}</div>
            <div class="opt"><span class="h">머리 색</span>${chips('hairColor', ['brown', 'black', 'yellow', 'red'], { swatch: 'hair' })}</div>
            <div class="opt"><span class="h">눈 크기</span>${chips('bigEyes', [true, false], { labels: { true: 'big eyes', false: 'small' } })}</div>
            <div class="opt"><span class="h">눈 색</span>${chips('eyeColor', ['brown', 'blue', 'green', 'black'], { swatch: 1 })}</div>
            <div class="opt"><span class="w">윗옷</span>${chips('top', ['T-shirt', 'jacket'])}</div>
            <div class="opt"><span class="w">윗옷 색</span>${chips('topColor', CL, { swatch: 1 })}</div>
            <div class="opt"><span class="w">아래옷</span>${chips('bottom', ['pants', 'shorts'])}</div>
            <div class="opt"><span class="w">아래옷 색</span>${chips('bottomColor', CL, { swatch: 1 })}</div>
            <div class="opt"><span class="w">신발 색</span>${chips('shoesColor', CL, { swatch: 1 })}</div>
            <div class="opt"><span class="w">모자</span>${chips('cap', ['', 'red', 'green', 'blue', 'pink', 'black'], { swatch: 1, none: '없음' })}</div>
            <div class="opt"><span class="w">안경</span>${chips('glasses', ['', 'black', 'red', 'blue'], { swatch: 1, none: '없음' })}</div>
          </div>
          <div class="qa">
            <div class="line"><span class="q">What does ${m.who === 'He' ? 'he' : 'she'} look like?</span>${sayBtn(`What does ${m.who === 'He' ? 'he' : 'she'} look like?`)}</div>
            ${sents.map(t => `<div class="line">${sayBtn(t)}<span><span class="en">${colorize(t)}</span><span class="pron">${pron(t)}</span></span></div>`).join('')}
            <div class="row" style="margin-top:6px"><button class="btn primary" data-readall>▶ 모두 읽기</button><button class="btn" data-random>무작위로 꾸미기</button><button class="btn primary" data-medone>완성</button></div>
          </div>
        </div>
      </div>`;
  }

  // ---------- events ----------
  sheet.addEventListener('click', e => {
    const t = e.target.closest('button, [data-ms]');
    if (!t) return;
    const d = t.dataset;
    if (d.tabGo) { S.tab = d.tabGo; store.set('tab', S.tab); render(); window.scrollTo({ top: 0 }); return; }

    // 1
    if (d.wbgo) { S.wb.i = +d.wbgo; S.wb.msg = ''; render(); return; }
    if (d.wb) {
      const q = WB[S.wb.i];
      if (d.wb === q.ans) { S.wb.done[S.wb.i] = true; S.wb.msg = '정답이에요!'; speak(q.phrase); }
      else { S.wb.msg = `다시 골라 보세요. ${d.wb}는 아니에요.`; }
      render();
      if (d.wb !== q.ans) document.getElementById('wbpic').classList.add('shake');
      return;
    }
    if ('wbnext' in d) { S.wb.i = Math.min(WB.length - 1, S.wb.i + 1); S.wb.msg = ''; render(); return; }
    if ('wbreset' in d) { S.wb = { i: 0, done: WB.map(() => false), msg: '' }; render(); return; }

    // 2/3
    if (d.ms != null && (S.tab === 'has' || S.tab === 'wear')) {
      const st = S[S.tab], i = +d.ms;
      if (st.ok[i] != null) return;
      st.sel = st.sel === i ? null : i; st.bad = null; st.msg = ''; render(); return;
    }
    if (d.mp != null) {
      const key = S.tab, st = S[key], items = key === 'has' ? HAS : WEAR, i = +d.mp;
      if (st.sel == null) { st.msg = '먼저 왼쪽 문장을 눌러 주세요.'; st.bad = null; render(); return; }
      if (i === st.sel) { st.n++; st.ok[i] = st.n; speak(items[i].s); st.msg = '딩동댕! ' + items[i].s; st.sel = null; st.bad = null; }
      else { st.bad = i; st.msg = '다시 생각해 보세요. 문장을 한 번 더 들어 볼까요?'; }
      render(); return;
    }
    if (d.mreset) { S[d.mreset] = newMatch(d.mreset === 'has' ? HAS : WEAR); render(); return; }

    // 4
    const b = S.bingo;
    if (d.mode) { b.mode = d.mode; b.msg = ''; b.bad = null; render(); return; }
    if (d.pron) { b.pron = d.pron; render(); return; }
    if (d.cell != null) {
      const i = +d.cell; b.bad = null;
      if (b.mode === 'sort') {
        b.sel = i; b.msg = '';
        if (b.sorted[i]) speak(fullSent(i, b.pron));
      } else {
        const L = b.lock;
        if (L.step === 6) return;
        if (!L.started) { b.msg = '먼저 ▶ 시작하기를 눌러요.'; }
        else if (L.seq.slice(0, L.step).some(q => q.i === i)) { b.msg = '이미 찾은 칸이에요. 다음 문장을 들어 보세요.'; }
        else if (L.seq[L.step].i === i) {
          L.step++; b.msg = L.step === 6 ? '' : `맞았어요! 이제 ${L.step + 1}번째 문장을 들어요.`;
          if (L.step < 6) { const nx = L.seq[L.step].t; setTimeout(() => { if (S.bingo.lock === L && L.step < 6) speak(nx); }, 700); }
        } else { b.bad = i; L.miss++; b.msg = '다시 들어 보세요.'; speak(L.seq[L.step].t); }
      }
      render(); return;
    }
    if (d.sort) {
      const i = b.sel, c = BOARD[i];
      if (d.sort === c.v) { b.sorted[i] = true; b.msg = ''; speak(fullSent(i, b.pron)); }
      else { b.msg = c.v === 'has' ? '다시 생각해 보세요. 머리나 눈은 몸의 특징이에요.' : '다시 생각해 보세요. 옷이나 신발은 입거나 신는 거예요.'; b.bad = i; }
      render(); return;
    }
    if ('listen' in d) { const L = b.lock; L.started = true; b.msg = ''; speak(L.seq[L.step].t); render(); return; }
    if ('showtext' in d) { b.showText = !b.showText; render(); return; }
    if ('lockreset' in d) { b.lock = newLock(); b.msg = ''; render(); return; }

    // 5
    if (d.me) {
      let v = d.v; if (d.me === 'bigEyes') v = v === 'true';
      S.me[d.me] = v; render(); return;
    }
    if ('medone' in d) { S.hidden = []; S.meDone = true; S.confetti = true; render(); window.scrollTo({ top: 0 }); speak(`What does ${S.me.who === 'He' ? 'he' : 'she'} look like? ` + meSentences().join(' ')); return; }
    if ('hide' in d) {
      const n = meSentences().length, k = Math.max(2, Math.ceil(n / 2));
      S.hidden = shuffle([...Array(n).keys()]).slice(0, k); try { speechSynthesis.cancel(); } catch (e) {} render(); return;
    }
    if ('unhide' in d) { S.hidden = []; render(); return; }
    if (d.tog != null) {
      const k = +d.tog;
      if (S.hidden.includes(k)) { S.hidden = S.hidden.filter(x => x !== k); speak(meSentences()[k]); }
      else { S.hidden.push(k); try { speechSynthesis.cancel(); } catch (e) {} }
      render(); return;
    }
    if ('meredo' in d) { S.hidden = []; S.meDone = false; render(); window.scrollTo({ top: 0 }); return; }
    if ('readall' in d) { speak(`What does ${S.me.who === 'He' ? 'he' : 'she'} look like? ` + meSentences().join(' ')); return; }
    if ('random' in d) {
      const r = a => a[Math.floor(Math.random() * a.length)];
      const CL = ['red', 'orange', 'yellow', 'green', 'blue', 'purple', 'pink', 'brown', 'black', 'white'];
      Object.assign(S.me, { who: r(['He', 'She']), hair: r(['short', 'straight', 'curly']), hairColor: r(['brown', 'black', 'yellow', 'red']), bigEyes: Math.random() < .5, eyeColor: r(['brown', 'blue', 'green', 'black']), top: r(['T-shirt', 'jacket']), topColor: r(CL), bottom: r(['pants', 'shorts']), bottomColor: r(CL), shoesColor: r(CL), cap: r(['', '', 'red', 'green', 'blue', 'pink']), glasses: r(['', '', 'black', 'red']) });
      render(); return;
    }
  });
  sheet.addEventListener('keydown', e => {
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[data-ms]')) { e.preventDefault(); e.target.click(); }
  });

  if (!TABS.some(t => t.id === S.tab)) S.tab = 'wb';
  render();
})();
</script>
</body>
</html>
